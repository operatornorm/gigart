name: Windows launcher

on:
  push:
    branches: [main]
    tags: ['v0.2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Offline tests and exact tested-source pins
        run: python -m unittest discover -s tests -v
      - name: Install pinned build wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
      - name: Build portable launcher
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx
          --name RE6MercenariesPatch --add-data "candidate.json:."
          --add-data "docs/tested-build.json:docs" steam_patch.py
      - name: Frozen executable and GUI startup check (no game access)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\RE6MercenariesPatch.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen launcher startup failed ($($process.ExitCode))." }
      - name: Package only release files
        run: python tools/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-launcher
          path: |
            dist/RE6MercenariesPatch-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v0.2.')
    needs: [linux-tests, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-launcher
          path: release-files
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-files/*.zip release-files/SHA256SUMS.txt
          --verify-tag --title "RE6 Mercenaries Steam launcher $RELEASE_TAG"
          --notes-file docs/RELEASE-NOTES.md
      - name: Preserve the exact original source archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          frozen = json.loads(Path('docs/tested-build.json').read_text())
          archive = Path('re6-v110-investigation.zip')
          with archive.open('wb') as stream:
              subprocess.run(['git', 'archive', '--format=zip', frozen['source_commit']], stdout=stream, check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == frozen['original_kit_sha256']
          PY
          if ! gh release view v0.1.0-tested > /dev/null 2>&1; then
            gh release create v0.1.0-tested re6-v110-investigation.zip --verify-tag --title 'Exact tested three-player source kit' --notes 'Original source kit used for the reported three-player standard and No Mercy Mercenaries sessions. No game files included. SHA-256: 3e4782499f9e31ee81da5b555f1d4872f59a32c767d46f4bca26c21a5ea55138. See the repository evidence document for scope and limitations.' --latest=false
          fi
